<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KK Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://js.puter.com/v2/"></script>
</head>
<body data-theme="dark">
  <!-- Topbar -->
  <header class="topbar">
    <h1>KK Chat</h1>
    <div class="top-controls">
      <span id="onlineCount">Online: [0 Users]</span>
      <button id="adminPanelBtn" aria-label="Admin Panel" style="display: none;" title="Open Admin Panel">👑</button>
      <button id="muteSoundBtn" aria-label="Mute sounds" title="Mute sounds">🔊</button>
      <button id="toggleThemeBtn" aria-label="Toggle theme">🌓</button>
    </div>
  </header>

  <!-- Username Modal -->
  <div id="usernameModal" class="modal">
    <div class="modal-inner">
      <h2>Choose a display name</h2>
      <input
        id="usernameInput"
        type="text"
        placeholder="Enter your name (e.g. John)"
        maxlength="24"
      />
      <div class="modal-actions">
        <button id="setNameBtn">Start Chatting 🚀</button>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <main class="chat-wrapper">
    <div id="chatBox" role="log" aria-live="polite"></div>
    <button id="scrollToBottomBtn" class="scroll-bottom-btn" style="display: none;" title="Scroll to bottom">⬇️</button>

    <!-- Typing Indicator -->
    <div id="typingIndicator" aria-hidden="true" class="typing-indicator">
      <em id="typingText"></em>
    </div>

    <!-- Reply Preview -->
    <div id="replyPreview" class="reply-preview" style="display: none;">
      <div class="reply-preview-text" id="replyPreviewText">Replying to...</div>
      <div class="cancel-reply" id="cancelReplyBtn">✖</div>
    </div>

    <!-- Input Area -->
    <div id="inputArea" class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
        autocomplete="off"
      />
      <input type="file" id="imageUploadInput" accept="image/*" style="display: none;" />
      <button id="emojiBtn" title="Insert Emoji">😀</button>
      <div id="emojiPicker" class="emoji-picker" style="display: none;"></div>
      <button id="uploadImageBtn" aria-label="Upload image" title="Send an image">🖼️</button>
      <button id="recordBtn" aria-label="Record voice" title="Click to start/stop recording">🎙️</button>
      <button id="sendBtn">Send</button>
    </div>
  </main>

  <!-- Admin Panel (Only MASTER can see) -->
  <div id="adminPanel" class="modal" style="display: none;">
    <div class="modal-inner">
      <h2>Admin Panel 👑</h2>
      <button id="clearChatBtn" class="admin-btn danger">🧼 Clear All Messages</button>
      <button id="clearAIBtn" class="admin-btn">🤖 Clear AI Messages</button>
      <button id="exportChatBtn" class="admin-btn" style="background-color: var(--success);">💾 Export Chat History</button>
      <input
        id="announcementInput"
        type="text"
        placeholder="Type announcement..."
        maxlength="100"
      />
      <button id="announceBtn" class="admin-btn announce">📢 Send Announcement</button>
      <button id="closeAdminBtn" class="admin-btn" style="background-color: var(--text-muted); margin-top: 10px;">❌ Close Panel</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
